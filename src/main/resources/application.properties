spring.application.name=infeara-website
server.port=${PORT:8080}
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Canonical origin used for canonical links, Open Graph URLs and sitemap entries.
# Never derived from the request Host header, so a spoofed host cannot change it.
seo.base-url=${SITE_BASE_URL:https://www.infeara.com}
# index,follow only when the deployment is allowed to appear in search results.
# Left empty, a deployment is indexable only when seo.base-url is served over HTTPS.
seo.indexable=${SITE_INDEXABLE:}

# Performance: compress text responses so HTML, CSS, JS and XML stay small over the wire.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

# Content manager (/cms). No credential is stored in this repository: the account exists only when
# the deployment supplies one. Prefer CMS_ADMIN_PASSWORD_HASH (BCrypt); CMS_ADMIN_PASSWORD is
# accepted so a platform secret store can hold a single entry, and is hashed in memory at start-up.
# With neither set, the account does not exist and /cms stays closed.
cms.username=${CMS_ADMIN_USERNAME:cms-admin}
cms.password=${CMS_ADMIN_PASSWORD:}
cms.password-hash=${CMS_ADMIN_PASSWORD_HASH:}
cms.max-attempts=${CMS_MAX_ATTEMPTS:5}
cms.lockout-minutes=${CMS_LOCKOUT_MINUTES:15}

# Session hardening. The cookie is unreadable from script, is not sent on cross-site posts, and
# carries a name that does not advertise the server. "secure" is left to the container so it
# follows the request scheme: true behind TLS, false on a local port.
server.servlet.session.cookie.name=CMS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=15m
