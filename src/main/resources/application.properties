spring.application.name=infeara-website
server.port=${PORT:8080}
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Canonical origin used for canonical links, Open Graph URLs and sitemap entries.
# Never derived from the request Host header, so a spoofed host cannot change it.
seo.base-url=${SITE_BASE_URL:http://localhost:8080}
# index,follow only when the deployment is allowed to appear in search results.
# Left empty, a deployment is indexable only when seo.base-url is served over HTTPS.
seo.indexable=${SITE_INDEXABLE:}

# Performance: compress text responses so HTML, CSS, JS and XML stay small over the wire.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024
