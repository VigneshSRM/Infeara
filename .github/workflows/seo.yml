name: SEO release gate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Start application
        env:
          SITE_BASE_URL: http://localhost:8080
          SITE_INDEXABLE: 'true'
        run: |
          nohup java -jar target/*.jar > application.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "Application is up after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start."
          tail -n 200 application.log
          exit 1

      - name: Run SEO release gate
        run: scripts/seo-smoke-test.sh http://localhost:8080

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: application.log
