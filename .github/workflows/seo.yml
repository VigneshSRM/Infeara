name: SEO release gate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Build
        run: |
          set -o pipefail
          mvn -B -DskipTests package 2>&1 | tee build.log

      # Compiler diagnostics are reported as check annotations so they stay readable from the
      # API even when job logs are inaccessible.
      - name: Report build diagnostics
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "ERROR|error:|BUILD FAILURE|Could not resolve" build.log | head -20 | while IFS= read -r line; do
              echo "::error title=Maven::$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-380)"
            done
            echo "::notice title=Maven tail::$(tail -25 build.log | tr '\n' ' ' | cut -c1-380)"
          else
            echo "::error::build.log was not produced"
          fi

      - name: Start application
        if: success()
        env:
          SITE_BASE_URL: http://localhost:8080
          SITE_INDEXABLE: 'true'
        run: |
          nohup java -jar target/*.jar > application.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "Application is up after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start."
          tail -n 200 application.log
          exit 1

      - name: Run SEO release gate
        if: success()
        run: |
          set -o pipefail
          scripts/seo-smoke-test.sh http://localhost:8080 2>&1 | tee seo.log

      - name: Report SEO gate findings
        if: failure() || cancelled()
        run: |
          if [ -f seo.log ]; then
            grep -E "FAIL|problem groups" seo.log | head -20 | while IFS= read -r line; do
              echo "::error title=SEO gate::$(printf '%s' "$line" | cut -c1-380)"
            done
            echo "::notice title=SEO gate summary::$(tail -6 seo.log | tr '\n' ' ' | cut -c1-380)"
          fi
          if [ -f application.log ]; then
            grep -E "Exception|Caused by|TemplateInput|ERROR" application.log | head -6 | while IFS= read -r line; do
              echo "::error title=Application::$(printf '%s' "$line" | cut -c1-380)"
            done
            echo "::notice title=Application log tail::$(tail -8 application.log | tr '\n' ' ' | cut -c1-380)"
          fi

      # Publishes the gate's own output as check annotations so the result of a real run
      # against the running server is readable from the API as well as the job log.
      - name: Publish gate evidence
        if: success()
        run: |
          grep -E "^  (ok|FAIL)|SEO release gate|Application is up" seo.log | head -18 | while IFS= read -r line; do
            echo "::notice title=Live check::$(printf '%s' "$line" | cut -c1-360)"
          done
          echo "::notice title=Live check::application started and answered /api/health ($(wc -l < seo.log | tr -d ' ') gate output lines)"

      # Surfaces what the running server actually returns, so the deployed build can be
      # inspected from the API without access to the job log.
      - name: Publish runtime evidence
        if: success()
        run: |
          echo "::notice title=Runtime::$(java -version 2>&1 | head -1) $(unzip -p target/*.jar META-INF/MANIFEST.MF 2>/dev/null | grep -i 'Spring-Boot-Version' | tr -d '\r')"
          grep -E "Tomcat started|Started .* in [0-9]" application.log | head -2 | while IFS= read -r line; do
            echo "::notice title=Startup::$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-360)"
          done
          PAGE=http://localhost:8080/services/network-engineering/wi-fi-infrastructure
          echo "::notice title=Rendered page::$(curl -fsS $PAGE | grep -o '<title>[^<]*</title>' | head -1 || true)"
          echo "::notice title=Rendered page::$(curl -fsS $PAGE | grep -o '<meta name="description" content="[^"]*"' | head -1 | cut -c1-360 || true)"
          echo "::notice title=Rendered page::intro/scope columns=$(curl -fsS $PAGE | grep -c 'page-copy-list' || true) faq blocks=$(curl -fsS $PAGE | grep -c 'faq-list' || true) h1 count=$(curl -fsS $PAGE | grep -c '<h1' || true)"
          echo "::notice title=Rendered page::$(curl -fsS $PAGE | grep -o '<h2>When this work[^<]*</h2>' | head -1 || true)"

      - name: Upload runnable jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: infeara-website-jar
          path: target/*.jar
          if-no-files-found: warn

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: |
            application.log
            build.log
            seo.log
          if-no-files-found: warn
